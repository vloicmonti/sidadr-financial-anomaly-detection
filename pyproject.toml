[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sidadr"
version = "0.1.0.dev0"
description = "SIDADR — Financial Data Quality & Anomaly Intelligence Platform (prototype local)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Vincent Loïc Monti" }]
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "pandas-stubs"]

[project.scripts]
sidadr = "sidadr.cli:main"
sidadr-generate = "sidadr.synthetic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # caractères accentués et typographiques français assumés

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true
