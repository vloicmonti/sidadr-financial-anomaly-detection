[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sidadr"
version = "0.1.0"
description = "SIDADR — Financial Data Quality & Anomaly Intelligence Platform (prototype local)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Vincent Loïc Monti" }]
dependencies = [
    "openpyxl>=3.1",
    "python-calamine>=0.9",  # lecture des .xls et .ods
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6",
    "rapidfuzz>=3.9",
    "pyarrow>=16",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "pandas-stubs", "httpx>=0.27", "odfpy>=1.4.1"]

[project.scripts]
sidadr = "sidadr.cli:main"
sidadr-generate = "sidadr.synthetic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Avertissement de Starlette sur httpx : sans effet sur les tests, paquet de remplacement non vérifié.
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# E501 : la longueur du code est gérée par `ruff format` ; seules les chaînes de texte
# françaises peuvent dépasser, et les couper nuirait à leur lisibilité.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true
