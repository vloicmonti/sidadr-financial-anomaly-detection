# Score qualité SIDADR : moyenne pondérée de dimensions, chacune entre 0 et 1.
# C'est un indicateur interne paramétrable, pas une norme.
# Une dimension qui ne peut pas encore être évaluée est exclue et les poids
# restants sont renormalisés ; le rapport le signale explicitement.

dimensions:
  completeness:
    weight: 0.30
    label: Complétude
    definition: 1 - part des cellules vides parmi les champs obligatoires
  uniqueness:
    weight: 0.20
    label: Unicité
    definition: 1 - part des lignes impliquées dans un doublon d'identifiant (même fichier ou inter-fichiers)
  validity:
    weight: 0.30
    label: Validité
    definition: 1 - part des cellules renseignées hors format (dates, montants, valeurs énumérées)
  consistency:
    weight: 0.20
    label: Cohérence
    definition: 1 - part des lignes violant au moins une règle métier de cohérence
